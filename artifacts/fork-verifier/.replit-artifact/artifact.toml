kind = "web"
previewPath = "/"
title = "ULTRA GURU Fork Verifier"
version = "1.0.0"
id = "artifacts/fork-verifier"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25883

[services.development]
run = "pnpm --filter @workspace/fork-verifier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fork-verifier", "run", "build" ]
publicDir = "artifacts/fork-verifier/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25883"
BASE_PATH = "/"
